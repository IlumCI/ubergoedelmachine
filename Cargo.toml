[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/euroswarms/samaritan"

[workspace.dependencies]
samaritan-dsl = { path = "crates/samaritan-dsl" }
samaritan-kernel = { path = "crates/samaritan-kernel" }
samaritan-ledger = { path = "crates/samaritan-ledger" }
