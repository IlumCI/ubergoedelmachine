# Samaritan runtime configuration.
#
# Both agents talk to a local OpenAI-compatible chat-completions endpoint.
# scripts/serve.ps1 starts llama.cpp with settings tuned for this machine.

[agent]
base_url = "http://127.0.0.1:8080/v1"
api_key = ""                     # local servers generally want nothing
request_timeout_secs = 600       # ~9 tok/s means a long answer is minutes

# How the model is forced to emit parseable output.
#   "grammar" - GBNF, llama.cpp only. The sampler cannot produce invalid
#               output, so there is nothing to retry. Strongly preferred,
#               and close to required for an abliterated checkpoint: refusal
#               ablation costs some instruction-following along with the
#               refusals, and a reply that will not parse costs a full
#               regeneration.
#   "schema"  - JSON schema via response_format. Portable, weaker.
#   "none"    - parse and retry. Expensive here.
constrain = "grammar"
max_retries = 2

# Sampling is the only nondeterminism in an episode. Pin this and a run can
# be replayed exactly; leave it unset and the agent draws one per process and
# records it, because a seed nobody can see is not a seed.
# seed = 20260911

[agent.models]
# The two agents are, in the shorthand this project uses, the Christ and the
# Anti-Christ. Both are real grammar-constrained local models.
#
#   playout / proposer  = the Warden       = "the Christ"   (the solver)
#   deviant             = the Deviant      = "the Anti-Christ"
#
# They now want different checkpoints, and a 4 GB GPU cannot hold both, so
# scripts\serve.ps1 serves one at a time under a single alias — the name below,
# which every role and example asks for. Switch the served model by role:
#   scripts\serve.ps1 -Role solver    # Qwen3-4B-Thinking Q8_0, -ngl 30
#   scripts\serve.ps1 -Role deviant   # Ministral-3 8B abliterated Q6_K, -ngl 18
#
# The solver is a reasoning-distilled 4B because, benched on this box, the 8B is
# too slow to think inside the time budget (see docs/inference.md). The deviant
# stays abliterated because attempting the refused is its job.
playout  = "samaritan-playout"   # the Christ, solving tasks (solver role)
proposer = "samaritan-playout"   # the Christ, proposing self-modifications
deviant  = "samaritan-playout"   # the Anti-Christ, attacking the guards

[sampling]
playout_temperature  = 0.7
proposer_temperature = 0.9       # more exploration when proposing mutations
deviant_temperature  = 1.0       # the Deviant is meant to be creative
max_tokens = 1024
# The abliterated checkpoint loops — a clause or a `..\` segment repeated until
# it overruns the budget and the JSON will not parse. A mild penalty stops that;
# the bout examples set 1.2 and cap attack tokens lower (640). See samaritan-agent.
repeat_penalty = 1.2

# Two models, one served at a time (a 4 GB GPU holds neither with room to
# spare). scripts\serve.ps1 -Role picks between them; both are a CPU+GPU split
# load. Operating points are measured, not guessed — see docs/inference.md.

[model.solver]
# The reasoning substrate. A 4B thinking model, because the 8B is too slow to
# think in budget: benched at 7.9 t/s generation vs this at 18.9 t/s (-ngl 30).
repo    = "detrax/Qwen3-4B-Thinking-2507-Qwen3.8-Max-Distillation-Detrax"
file    = "Qwen3-4B-Thinking-2507-Qwen3.8-Max-Distillation-Detrax-q8_0.gguf"
arch    = "qwen3"
quant   = "Q8_0"
size_gb = 3.98
gpu_layers = 30            # measured peak; generation 18.9 t/s, prefill 1003 t/s; cliff at 31

[model.deviant]
# The adversary. Abliterated so it will attempt what a refusal-trained model
# would decline — the point of the role, a liability in a solver.
repo    = "mradermacher/Huihui-Ministral-3-8B-Reasoning-2512-abliterated-GGUF"
file    = "Huihui-Ministral-3-8B-Reasoning-2512-abliterated.Q6_K.gguf"
arch    = "mistral3"
quant   = "Q6_K"
size_gb = 6.49
gpu_layers = 18            # measured; 18-19 equivalent, cliff at 20

[serve]
threads = 6                      # P-cores only; E-cores slow the batch down
threads_batch = 10               # prompt processing is compute-bound, use all
parallel = 2                     # dialled down after a thermal scare; raise once cooling is proven
ctx_per_slot = 4096              # room for a ~2 000-token thinking trace + prompt

[arena]
scratch_root = "C:/tmp/samaritan-arena"
warden_hold_threshold = 5
deviant_runaway_threshold = 3
